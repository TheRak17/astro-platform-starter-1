<!doctype html>
<html>
  <body>
    <button id="send">Send to Slack</button>
    <pre id="out"></pre>
    <script>
      document.getElementById("send").onclick = async () => {
        const res = await fetch("/.netlify/functions/slack-proxy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: "Hello from my website 👋" })
        }).catch(err => ({ ok:false, text: async()=>err.message }));
        const txt = await res.text();
        document.getElementById("out").textContent = txt;
      };
    </script>
  </body>
</html>
